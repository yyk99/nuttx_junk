# ST Nucleo-F767ZI (sourced by setup.sh)
NUTTX_CONFIG=nucleo-f767zi:nsh
CROSSDEV=arm-none-eabi-
# ARCH_LEDS off: otherwise NuttX drives LD1-LD3 as status LEDs and fights myhello
# LD1 (PB0, active high) is /dev/gpio4: the 4 GPIO inputs are registered first
KCONFIG_TWEAKS="-e MYHELLO -d MYHELLO_LED_ACTIVE_LOW -e DEV_GPIO -d ARCH_LEDS --set-str MYHELLO_GPIO_DEVPATH /dev/gpio4"
